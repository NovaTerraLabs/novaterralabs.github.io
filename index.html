<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaTerraLabs</title>
<style>
  :root { --bg: #fbf7f2; --text: #2b2420; --muted: #6b5f57; --accent: #8a5a2b; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1916; --text: #eee6dd; --muted: #b3a79c; --accent: #d9a46a; --card: #27221e; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .tag { color: var(--muted); margin: 0 0 32px; }
  .card { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 6px; font-size: 1.25rem; }
  .card p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>NovaTerraLabs</h1>
  <p class="tag">Small, relaxing mobile games.</p>

  <div class="card">
    <h2>Fidget Toys: Relax &amp; ASMR</h2>
    <p>A shelf full of satisfying fidget toys to pop, squish, spin and play with.</p>
    <a href="privacy.html">Privacy Policy</a>
  </div>

  <footer>Contact: <a href="mailto:novaterrlaabs0@gmail.com">novaterrlaabs0@gmail.com</a></footer>
</main>
</body>
</html>
